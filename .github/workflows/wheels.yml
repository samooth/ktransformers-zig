name: Build and Test Multi-Variant Wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-variants:
    name: "Build ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - avx2
          - avx512_base
          - avx512_vnni
          - avx512_vbmi
          - avx512_bf16
          - amx
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build ${{ matrix.variant }}
        run: zig build -Dvariant=${{ matrix.variant }}
      - name: Upload ${{ matrix.variant }} .so
        uses: actions/upload-artifact@v4
        with:
          name: libkt_kernel_ext_${{ matrix.variant }}
          path: zig-out/lib/libkt_kernel_ext_*.so

  abi-gate:
    name: "ABI gates + test suites"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build all variants
        run: zig build all-variants
      # The ABI is a contract: every prototype in include/kt_kernel.h
      # must have a matching Zig export in EVERY variant .so, with the
      # exact arity (verify_abi.py) — and the pybind11 shim's struct
      # layouts must match byte-for-byte (audit_layout.py). A silent
      # symbol regression otherwise ships in the wheel.
      - name: Build default variant for layout audit
        run: zig build -Dvariant=avx2
      # aarch64 is a build-and-gate target, never a wheel target: the
      # matrix above is x86 only, so without this leg a regression that
      # only affects aarch64 ships green. `amx.pshufb16` reached main that
      # way — inline x86 assembly with no comptime target guard, so the
      # cross-build failed while all six x86 variants and the whole test
      # suite passed. Build-only on purpose: this library must never end up
      # inside an x86 wheel.
      - name: Build aarch64 neon variant (build only, not a wheel)
        run: zig build -Dvariant=neon -Dtarget=aarch64-linux-gnu
      - name: "ABI gate: exports + arity (all variants, incl. aarch64)"
        run: python3 tools/verify_abi.py
      - name: "ABI gate: pybind11 struct layouts"
        run: python3 tools/audit_layout.py
      # No test has a timeout, and `zig build test` drives every suite through
      # `addRunArtifact`, so a suite that blocks forever stalls the job
      # indefinitely instead of reporting a failure. That has happened: an
      # intermittent hang in the Subpool pinning test (workers blocked on a
      # condvar at 0% CPU, i.e. a deadlock rather than starvation) held a run
      # for 22 minutes. It does not reproduce when the suite binaries are run
      # one at a time, which is why it is worth bounding rather than chasing.
      # 40 minutes is far above the healthy runtime on a CI runner and well
      # below the GitHub Actions job limit, so a hang becomes a red build.
      - name: "Test suites"
        run: timeout 2400 zig build test

  build-wheel:
    name: Build Python Wheel
    needs: [build-variants, abi-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build all variants
        run: zig build all-variants
      - name: Build wheel
        run: python setup.py build_ext --inplace
      - name: Install wheel
        run: |
          cd python && python -m pip install -e .
      - name: Smoke test
        run: |
          python -c "
          import kt_kernel as kt
          print('version:', kt.kt_version())
          print('variant:', kt.kt_get_cpu_variant())
          assert kt.kt_version() == b'0.6.1-zig'
          print('OK: import + version + variant auto-detect')
          "
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: kt-kernel-wheel
          path: python/kt_kernel/libkt_kernel_ext_*.so
